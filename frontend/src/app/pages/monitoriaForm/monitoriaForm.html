<main>
  <h1>{{ id === null ? 'Nova monitoria' : 'Editar monitoria' }}</h1>

  @if (mensagem()) {
  <p role="alert">{{ mensagem() }}</p>
  }

  @if (pronto()) {
  <form [formGroup]="formulario" (ngSubmit)="salvar()">
    <p>
      <label for="disciplina">Disciplina</label><br>
      <input id="disciplina" formControlName="disciplina" maxlength="50">
    </p>

    <p>
      <label for="nomeMonitor">Nome do monitor</label><br>
      <input id="nomeMonitor" formControlName="nomeMonitor" maxlength="100">
    </p>

    <p>
      <label for="vagasTotais">Total de vagas</label><br>
      <input id="vagasTotais" type="number" formControlName="vagasTotais" min="1">
    </p>

    <button type="submit" [disabled]="salvando()">Salvar</button>
  </form>
  } @else if (!mensagem()) {
  <p>Carregando monitoria...</p>
  }

  <p><a routerLink="/inicio">Voltar para a lista</a></p>
</main>
